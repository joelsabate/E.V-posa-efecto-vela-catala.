<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFECTO VELA · Català Unitat 2</title><style>:root{font-family:system-ui,Arial;color:#173354;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:30px auto;padding:20px}header{display:flex;align-items:center;gap:16px;margin-bottom:24px}.c{font-size:44px}h1{margin:0;font-size:32px}h2{font-size:23px}.sub{color:#526b89}.panel{background:white;padding:28px;border-radius:18px;box-shadow:0 5px 25px #1232}button{font:inherit;background:#2063b3;color:white;border:0;border-radius:10px;padding:14px 20px;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.option{display:block;width:100%;text-align:left;background:#f0f5fc;color:#173354;border:2px solid #d6e2f3;margin:10px 0}.option.selected{border-color:#2063b3;background:#dceafd}.option.correct{border-color:#2d995e;background:#e6f7ed}.option.wrong{border-color:#c84545;background:#ffebeb}.muted{color:#58718e;font-size:14px}.progress{height:9px;background:#d9e5f3;border-radius:20px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:#2063b3;transition:width .3s}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.result{font-size:42px;font-weight:800;color:#2063b3}.rule{background:#f0f6ff;border-left:5px solid #2063b3;padding:14px;border-radius:8px;margin:14px 0}.topic{display:block;width:100%;text-align:left;margin:10px 0;background:#edf4ff;color:#173354;border:1px solid #c8d9ef}.review{padding:12px;margin:10px 0;background:#f4f7fc;border-radius:10px}@media(max-width:600px){.wrap{margin:0;padding:14px}.panel{padding:19px}h1{font-size:25px}}</style></head><body><div class="wrap"><header><div class="c">🕯️</div><div><h1>EFECTO VELA</h1><div class="sub">Català · Unitat 2 · 3r de Primària</div></div></header><main class="panel" id="app"></main></div><script>const sets=[{"name": "Subjecte, predicat, oracions i refranys", "qs": [{"q": "Quin és el subjecte? «La mare prepara un pastís.»", "opts": ["La mare", "prepara", "un pastís"], "a": 0}, {"q": "Quin és el predicat? «El pare passa l’aspiradora.»", "opts": ["El pare", "passa l’aspiradora", "l’aspiradora"], "a": 1}, {"q": "Quin és el subjecte? «Els nens juguen al pati.»", "opts": ["juguen", "al pati", "Els nens"], "a": 2}, {"q": "Quin és el predicat? «La Júlia menja fruita.»", "opts": ["menja fruita", "La Júlia", "fruita"], "a": 0}, {"q": "«On és el meu llibre?» és una oració...", "opts": ["exclamativa", "interrogativa", "declarativa"], "a": 1}, {"q": "«Quin dia més bonic!» és una oració...", "opts": ["exclamativa", "declarativa", "interrogativa"], "a": 0}, {"q": "«El gat dorm.» és una oració...", "opts": ["interrogativa", "declarativa", "exclamativa"], "a": 1}, {"q": "Completa: «A la taula i al llit, al primer...»", "opts": ["crit", "plat", "joc"], "a": 0}, {"q": "Què vol dir «somiar truites»?", "opts": ["Fer-se il·lusions", "Tenir gana", "Anar a dormir"], "a": 0}, {"q": "Què vol dir «d’amagatotis»?", "opts": ["Molt de pressa", "Sense que et vegin", "Amb alegria"], "a": 1}]}, {"name": "Agudes, planes, esdrúixoles i accents", "qs": [{"q": "«pastís» és una paraula...", "opts": ["plana", "aguda", "esdrúixola"], "a": 1}, {"q": "«mantega» és una paraula...", "opts": ["plana", "aguda", "esdrúixola"], "a": 0}, {"q": "«música» és una paraula...", "opts": ["esdrúixola", "plana", "aguda"], "a": 0}, {"q": "«canyella» és una paraula...", "opts": ["aguda", "esdrúixola", "plana"], "a": 2}, {"q": "Quina paraula està ben escrita?", "opts": ["salmó", "sàlmo", "salmo"], "a": 0}, {"q": "Quina paraula està ben escrita?", "opts": ["platàn", "plàtan", "platan"], "a": 1}, {"q": "Quina paraula està ben escrita?", "opts": ["arros", "arrós", "arròs"], "a": 2}, {"q": "Quina paraula està ben escrita?", "opts": ["telefon", "telèfon", "teléfon"], "a": 1}, {"q": "Les paraules esdrúixoles porten accent...", "opts": ["sempre", "mai", "només de vegades"], "a": 0}, {"q": "Quina és la síl·laba tònica de «farina»?", "opts": ["fa", "ri", "na"], "a": 1}]}, {"name": "La recepta i comprensió lectora", "qs": [{"q": "Quina part d’una recepta diu què necessitem?", "opts": ["Ingredients", "Títol", "Conclusió"], "a": 0}, {"q": "Quina part explica què hem de fer, pas a pas?", "opts": ["Ingredients", "Preparació", "Nom del plat"], "a": 1}, {"q": "Quin d’aquests és un estri de cuina?", "opts": ["Farina", "Sucre", "Motlle"], "a": 2}, {"q": "Quin d’aquests és un ingredient?", "opts": ["Cullerot", "Ou", "Forn"], "a": 1}, {"q": "Què hem de fer primer abans de tallar una poma?", "opts": ["Rentar-la", "Servir-la", "Coure-la"], "a": 0}, {"q": "Quin és un ordre lògic per fer una recepta?", "opts": ["Servir, preparar, barrejar", "Preparar, barrejar, coure", "Coure, comprar, preparar"], "a": 1}, {"q": "Llegeix: «La mare prepara un pastís de poma.» Què prepara?", "opts": ["Una amanida", "Un pastís de poma", "Una sopa"], "a": 1}, {"q": "Llegeix: «El pare passa l’aspiradora.» Qui passa l’aspiradora?", "opts": ["El pare", "La mare", "En Biel"], "a": 0}, {"q": "Llegeix: «En Biel esmorza cereals amb llet.» Què esmorza?", "opts": ["Pa amb tomàquet", "Fruita", "Cereals amb llet"], "a": 2}, {"q": "Llegeix: «La Júlia renta els tomàquets abans de tallar-los.» Què fa primer?", "opts": ["Els talla", "Els renta", "Els menja"], "a": 1}]}, {"name": "Repàs abans del control", "qs": [{"q": "Quin és el subjecte? «La cuinera fa sopa.»", "opts": ["La cuinera", "fa sopa", "sopa"], "a": 0}, {"q": "Quin és el predicat? «Els ocells canten.»", "opts": ["Els ocells", "canten", "ocells"], "a": 1}, {"q": "«Has esmorzat?» és una oració...", "opts": ["declarativa", "exclamativa", "interrogativa"], "a": 2}, {"q": "Quin signe acaba una exclamació?", "opts": ["?", "!", "."], "a": 1}, {"q": "«arròs» és una paraula...", "opts": ["aguda", "plana", "esdrúixola"], "a": 0}, {"q": "«fàbrica» és una paraula...", "opts": ["plana", "esdrúixola", "aguda"], "a": 1}, {"q": "Quina forma és correcta?", "opts": ["musica", "música", "músíca"], "a": 1}, {"q": "Què vol dir «a tort i a dret»?", "opts": ["Pertot arreu", "A poc a poc", "En secret"], "a": 0}, {"q": "Què indica la preparació d’una recepta?", "opts": ["Els passos", "El preu", "El nom del cuiner"], "a": 0}, {"q": "Llegeix: «La Marta pela dues pomes.» Quantes pomes pela?", "opts": ["Una", "Tres", "Dues"], "a": 2}]}, {"name": "EXAMEN FINAL · Tots els temes", "qs": [{"q": "Quin és el subjecte? «La mare prepara un pastís.»", "opts": ["La mare", "prepara", "un pastís"], "a": 0}, {"q": "«pastís» és una paraula...", "opts": ["plana", "aguda", "esdrúixola"], "a": 1}, {"q": "Quina part d’una recepta diu què necessitem?", "opts": ["Ingredients", "Títol", "Conclusió"], "a": 0}, {"q": "Quin és el subjecte? «La cuinera fa sopa.»", "opts": ["La cuinera", "fa sopa", "sopa"], "a": 0}, {"q": "Quin és el subjecte? «Els nens juguen al pati.»", "opts": ["juguen", "al pati", "Els nens"], "a": 2}, {"q": "«música» és una paraula...", "opts": ["esdrúixola", "plana", "aguda"], "a": 0}, {"q": "Quin d’aquests és un estri de cuina?", "opts": ["Farina", "Sucre", "Motlle"], "a": 2}, {"q": "«Has esmorzat?» és una oració...", "opts": ["declarativa", "exclamativa", "interrogativa"], "a": 2}, {"q": "«On és el meu llibre?» és una oració...", "opts": ["exclamativa", "interrogativa", "declarativa"], "a": 1}, {"q": "Quina paraula està ben escrita?", "opts": ["salmó", "sàlmo", "salmo"], "a": 0}, {"q": "Què hem de fer primer abans de tallar una poma?", "opts": ["Rentar-la", "Servir-la", "Coure-la"], "a": 0}, {"q": "«arròs» és una paraula...", "opts": ["aguda", "plana", "esdrúixola"], "a": 0}, {"q": "«El gat dorm.» és una oració...", "opts": ["interrogativa", "declarativa", "exclamativa"], "a": 1}, {"q": "Quina paraula està ben escrita?", "opts": ["arros", "arrós", "arròs"], "a": 2}, {"q": "Llegeix: «La mare prepara un pastís de poma.» Què prepara?", "opts": ["Una amanida", "Un pastís de poma", "Una sopa"], "a": 1}, {"q": "Quina forma és correcta?", "opts": ["musica", "música", "músíca"], "a": 1}, {"q": "Què vol dir «somiar truites»?", "opts": ["Fer-se il·lusions", "Tenir gana", "Anar a dormir"], "a": 0}, {"q": "Les paraules esdrúixoles porten accent...", "opts": ["sempre", "mai", "només de vegades"], "a": 0}, {"q": "Llegeix: «En Biel esmorza cereals amb llet.» Què esmorza?", "opts": ["Pa amb tomàquet", "Fruita", "Cereals amb llet"], "a": 2}, {"q": "Què indica la preparació d’una recepta?", "opts": ["Els passos", "El preu", "El nom del cuiner"], "a": 0}]}];let setIndex=0,questions=[],idx=0,score=0,selected=null,locked=false,history=[];const el=document.getElementById('app');function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function menu(){el.innerHTML='<h2>Què vols practicar avui?</h2><p>Tria un tema o fes l’examen final. Totes les preguntes tenen 3 opcions i es corregeixen automàticament.</p>'+sets.map((s,i)=>`<button class="topic" data-set="${i}">${i+1}. ${s.name} <span class="muted">· ${s.qs.length} preguntes</span></button>`).join('')+'<div class="rule"><b>Consell:</b> Practica els quatre temes i després fes l’examen final de 20 preguntes.</div>';el.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>start(+b.dataset.set))}function start(i){setIndex=i;questions=shuffle(sets[i].qs);idx=0;score=0;history=[];render()}function render(){if(idx>=questions.length)return finish();locked=false;selected=null;let q=questions[idx];let options=shuffle(q.opts.map((t,i)=>({t,correct:i===q.a})));el.innerHTML=`<div class="muted">${sets[setIndex].name} · Pregunta ${idx+1} de ${questions.length} · ${score} encerts</div><div class="progress"><div style="width:${idx/questions.length*100}%"></div></div><h2>${q.q}</h2><p class="muted">Tria la resposta correcta.</p><div id="options"></div><div id="feedback" aria-live="polite"></div><div class="row"><button id="next" disabled>${idx===questions.length-1?'Veure resultats':'Següent pregunta'}</button><button id="home" style="background:#657d9c">Tornar al menú</button></div>`;let o=el.querySelector('#options');options.forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent=v.t;b.onclick=()=>{if(locked)return;locked=true;selected=v;let ok=v.correct;if(ok)score++;history.push({q:q.q,answer:q.opts[q.a],given:v.t,ok});[...o.children].forEach((x,j)=>{x.disabled=true;if(options[j].correct)x.classList.add('correct');else if(j===i)x.classList.add('wrong')});el.querySelector('#feedback').innerHTML=ok?'<p style="color:#267c4c"><b>✓ Molt bé!</b></p>':`<p style="color:#b23939"><b>✗ La resposta correcta és: ${q.opts[q.a]}</b></p>`;el.querySelector('#next').disabled=false};o.appendChild(b)});el.querySelector('#next').onclick=()=>{idx++;render()};el.querySelector('#home').onclick=menu}function finish(){let wrong=history.filter(h=>!h.ok);el.innerHTML=`<h2>Has acabat!</h2><div class="result">${score} / ${questions.length}</div><p>${score===questions.length?'Excel·lent! Tot correcte!':'Bona feina! Repassa els errors i torna-ho a provar.'}</p><div class="rule">${wrong.length?`<b>Errors per repassar (${wrong.length})</b>`:'<b>Cap error. Felicitats!</b>'}</div>`+wrong.map(h=>`<div class="review"><b>${h.q}</b><br>Has triat: ${h.given}<br><b>Correcta: ${h.answer}</b></div>`).join('')+'<div class="row"><button id="again">Tornar a jugar</button><button id="home" style="background:#657d9c">Tots els temes</button></div>';el.querySelector('#again').onclick=()=>start(setIndex);el.querySelector('#home').onclick=menu}menu();</script></body></html>
